<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css?v=2.5">
</head>
<body class="">
  <div class="edge-glow edge-left"></div>
  <div class="edge-glow edge-right"></div>
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom:1.5rem;">🔒 Admin Access</h3>
      <input type="password" id="adminPass" class="modal-input" placeholder="Password">
      <div style="display:flex; gap:1rem; justify-content:center;">
        <button class="modal-btn" onclick="checkAdminPass()">Login</button>
        <button class="modal-btn" style="background:rgba(255,255,255,0.1);" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="sky" id="sky"></div>
  
  <nav class="navbar">
    <div class="nav-links">
      <a href="#home" class="active" onclick="showSection('home'); return false;">Home</a>
      <a href="#experience" onclick="showSection('experience'); return false;">Experience</a>
      <a href="#selfdev" onclick="showSection('selfdev'); return false;">Skills</a>
      <a href="#awards" onclick="showSection('awards'); return false;">Awards</a>
      <a href="#leadership" onclick="showSection('leadership'); return false;">Leadership</a>
    </div>
    <button onclick="toggleTheme()" style="background:none; border:none; color:#fff; cursor:pointer; margin-left:1rem; font-size:1.2rem;">🌓</button>
  </nav>

  <section id="home" class="section-page active">
    <div class="container">
      <div class="hero-card-premium">
        <div class="hero-avatar-wrapper">
          <div id="heroAvatarContainer" style="width:100%; height:100%;"></div>
        </div>
        <div>
          <p id="heroTitle" style="color:var(--primary); font-weight:800; letter-spacing:2px; margin-bottom:0.5rem;"></p>
          <h1 id="heroName" class="hero-name"></h1>
          <p id="heroUni" style="opacity:0.6; margin-bottom:1rem; font-weight:600;"></p>
          <div id="heroSkills" style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.5rem;"></div>
          <p id="heroBio" style="opacity:0.8; line-height:1.8; max-width:600px; margin-bottom:1.5rem;"></p>
          <div id="heroEmailContainer"></div>
          <div id="heroLinks" style="display:flex; gap:1.2rem; margin-top:2rem;"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="experience" class="section-page">
    <div class="container">
      <div class="section-header-pro" style="margin-bottom:2rem;"><span class="label">01</span><h2>Experience</h2><div class="line"></div></div>
      <div id="expTabs" style="display:flex; justify-content:center; flex-wrap:wrap; gap:1.2rem; margin-bottom:3.5rem;"></div>
      <div id="projectsGrid" style="display:flex; flex-direction:column; align-items:center; width:100%; gap:2rem;"></div>
    </div>
  </section>

  <section id="selfdev" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">02</span><h2>Skills & Development</h2><div class="line"></div></div>
      <div id="certsGrid"></div>
      <div id="workshopsGrid" style="margin-top:2rem;"></div>
    </div>
  </section>

  <section id="awards" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">03</span><h2>Awards</h2><div class="line"></div></div>
      <div id="competitionsGrid"></div>
    </div>
  </section>

  <section id="leadership" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">04</span><h2>Leadership</h2><div class="line"></div></div>
      <div id="leadershipGrid"></div>
    </div>
  </section>

  <div class="edit-bar" id="editBar" style="display: none;">
    <button class="modal-btn" style="background:#22c55e;" onclick="saveData()">💾 Save All Changes</button>
    <button class="modal-btn" style="background:#3b82f6;" onclick="downloadBackup()">📥 Download Backup</button>
    <button class="modal-btn" style="background:#ff4444;" onclick="exitEditMode()">🔒 Close</button>
  </div>

  <script>
    const sky = document.getElementById('sky');
    function initBackground() {
      if (!sky) return;
      const isLight = document.body.classList.contains('light-mode');
      sky.innerHTML = '';
      
      // Render 3 deep drifting cosmic nebulae in both dark and light modes for maximum colorful aesthetics
      const n1 = document.createElement('div'); n1.className = 'cosmic-nebula nebula-purple'; sky.appendChild(n1);
      const n2 = document.createElement('div'); n2.className = 'cosmic-nebula nebula-cyan'; sky.appendChild(n2);
      const n3 = document.createElement('div'); n3.className = 'cosmic-nebula nebula-pink'; sky.appendChild(n3);

      if (!isLight) {
        // Twinkling stars starry night is exclusive to Dark Mode
        for(let i=0; i<45; i++) { // Optimized star count to 45 for ultimate CPU performance
          const s = document.createElement('div'); s.className = 'twinkle';
          s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
          s.style.width = s.style.height = (Math.random()*2+1)+'px';
          s.style.setProperty('--d', (Math.random()*4+2)+'s');
          sky.appendChild(s);
        }
      }
    }
    initBackground();

    function createShootingStar() {
      if (document.body.classList.contains('light-mode')) return;
      const s = document.createElement('div');
      s.className = 'star-ultra';
      s.style.top = Math.random()*70 + '%';
      s.style.left = '100%';
      s.style.width = (Math.random()*150+100) + 'px';
      s.style.setProperty('--dur', (Math.random()*2+2) + 's');
      sky.appendChild(s); setTimeout(() => s.remove(), 4000);
    }
    setInterval(createShootingStar, 4000); // Optimized to 4 seconds interval to prevent browser paint stress

    const SUPABASE_URL = 'https://odyrnnzcixwnpcirtaad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BFWtCpz_nUWiixMnbjGObQ_ApM9I20l';
    const db = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    
    // Default restored backup data as structural and offline-first fallback
    const DEFAULT_DATA = {
        "personal": {
            "name": "Hemmarat Phanthanawibun",
            "title": "Front End Developer -  Portfolio",
            "university": "College of Arts, Media and Technology ( Digital Industrial Integration )",
            "bio": "Hi ! My nickname is Much (I’m  student at Chiang Mai University.)",
            "avatar": "https://cdn.phototourl.com/free/2026-04-28-fcfaaeb0-8114-4d87-90f4-fe6adce2f7ab.jpg",
            "skills": [
                "HTML",
                "CSS",
                "Javascript",
                "C++",
                "C",
                "Python",
                "Arduino"
            ],
            "contact": {
                "email": "nnnm26171@gmail.com",
                "github": "",
                "linkedin": "",
                "website": ""
            },
            "nameColor": "",
            "nameGlow": ""
        },
        "experience": {
            "production": [
                {
                    "id": "ag8sef6",
                    "name": "ชื่อโปรเจกต์",
                    "role": "Full-Stack Developer",
                    "description": "คำอธิบายโปรเจกต์",
                    "year": "2024",
                    "tech": [
                        "React"
                    ],
                    "link": "",
                    "img": ""
                }
            ],
            "competition": [],
            "academic": [
                {
                    "id": "0tsn6ft",
                    "name": "Chiang Mai University",
                    "img": "https://upload.wikimedia.org/wikipedia/th/thumb/d/db/Chiang_Mai_University.svg/1280px-Chiang_Mai_University.svg.png",
                    "role": "I am studying at Chiang Mai University.",
                    "year": "",
                    "link": "",
                    "description": ""
                },
                {
                    "id": "fhs3ksa",
                    "name": "Phitsanulok Pittayakom School",
                    "img": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3RY7oXzZwCOiNrj095dS8WTh8ZGjtt0_KJw&s",
                    "role": "I have studied here since Grade 10 to Grade 12 in the SMTE (Science, Mathematics, Technology, and Environment) special program.",
                    "year": "",
                    "link": "",
                    "description": ""
                }
            ],
            "personal": [],
            "opensource": []
        },
        "selfDev": {
            "certs": [],
            "workshops": []
        },
        "awards": [],
        "leadership": [
            {
                "id": "0k68sr6",
                "name": "",
                "img": "",
                "role": "",
                "org": "",
                "date": "",
                "desc": ""
            }
        ]
    };

    let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    let currentTab = 'academic', editMode = false;

    function normalizeData(loadedData) {
      if (!loadedData) return JSON.parse(JSON.stringify(DEFAULT_DATA));
      
      // Ensure basic structure exists
      if (!loadedData.personal) loadedData.personal = {};
      if (!loadedData.experience) loadedData.experience = { production: [], competition: [], academic: [], personal: [], opensource: [] };
      if (!loadedData.selfDev) loadedData.selfDev = { certs: [], workshops: [] };
      if (!loadedData.leadership) loadedData.leadership = [];
      
      // Normalize awards (app.js object -> index.html array)
      if (loadedData.awards && !Array.isArray(loadedData.awards)) {
        if (Array.isArray(loadedData.awards.competitions)) {
          loadedData.awards = loadedData.awards.competitions;
        } else {
          loadedData.awards = [];
        }
      }
      if (!loadedData.awards) loadedData.awards = [];

      // Normalize email (app.js contact.email -> index.html personal.email)
      if (loadedData.personal && !loadedData.personal.email && loadedData.personal.contact && loadedData.personal.contact.email) {
        loadedData.personal.email = loadedData.personal.contact.email;
      }
      
      return loadedData;
    }

    function isValidData(loadedData) {
      if (!loadedData) return false;
      if (!loadedData.personal || !loadedData.personal.name) return false;
      const name = loadedData.personal.name.trim();
      if (name === '' || name === 'ชื่อ-นามสกุล' || name === 'ชื่อ-นามสกุลของคุณ' || name === 'Name') {
        return false;
      }
      return true;
    }

    async function loadData() {
      // 1. Instantly load from localStorage first for 0ms load speed!
      let hasRendered = false;
      try {
        const localData = localStorage.getItem('portfolio');
        if (localData) {
          const parsed = JSON.parse(localData);
          if (isValidData(parsed)) {
            data = normalizeData(parsed);
            renderAll();
            hasRendered = true;
          }
        }
      } catch (e) {
        console.error("Local storage fast-load failed:", e);
      }

      // 2. If no localStorage, fetch static data.json instantly as the second fastest option
      if (!hasRendered) {
        try {
          const response = await fetch('data.json');
          if (response.ok) {
            const localJson = await response.json();
            if (isValidData(localJson)) {
              data = normalizeData(localJson);
              renderAll();
              hasRendered = true;
            }
          }
        } catch (e) {
          console.warn("Fast data.json load failed:", e);
        }
      }

      // 2.5 Ultimate Fail-safe: If both cache and fetch failed (e.g. CORS under file:// in Incognito Mode), load default data!
      if (!hasRendered) {
        if (typeof DEFAULT_DATA !== 'undefined' && isValidData(DEFAULT_DATA)) {
          data = normalizeData(DEFAULT_DATA);
          renderAll();
          hasRendered = true;
        }
      }

      // 3. In the background (without blocking page load), fetch latest data from Supabase Cloud
      // to automatically update and synchronize changes without lag!
      setTimeout(async () => {
        try {
          if (db) {
            const { data: dbData, error } = await db.from('Portfolio_data').select('content').eq('id', 'main_portfolio').single();
            if (dbData && dbData.content && isValidData(dbData.content)) {
              const freshData = normalizeData(dbData.content);
              // Compare if changed to avoid unnecessary re-rendering
              const currentString = JSON.stringify(data);
              const freshString = JSON.stringify(freshData);
              if (currentString !== freshString) {
                data = freshData;
                localStorage.setItem('portfolio', JSON.stringify(data));
                renderAll();
              }
            }
          }
        } catch (e) {
          console.error("Background Supabase sync failed:", e);
        }
      }, 50); // Small timeout to ensure initial paint completes instantly
    }

    async function saveData() {
      // 1. Save to localStorage immediately so changes are never lost in this browser
      try {
        localStorage.setItem('portfolio', JSON.stringify(data));
      } catch(e) {
        console.error("Failed to save to localStorage:", e);
      }

      // 2. Try to sync to Supabase (using upsert to ensure it handles inserts/updates perfectly)
      let cloudSaved = false;
      try {
        if (db) {
          const { error } = await db.from('Portfolio_data').upsert({ id: 'main_portfolio', content: data });
          if (!error) {
            cloudSaved = true;
          } else {
            console.warn("Supabase save error:", error);
          }
        }
      } catch(e) {
        console.error("Supabase sync failed:", e);
      }

      if (cloudSaved) {
        alert("✅ Data Saved & Synced Successfully!");
      } else {
        alert("⚠️ Saved locally in this browser!\nNote: Supabase cloud is currently offline, so it couldn't sync online. Make sure to download a backup!");
      }
      exitEditMode();
    }

    function downloadBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 4));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href",     dataStr);
      downloadAnchor.setAttribute("download", "portfolio.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function exitEditMode() { editMode = false; document.body.classList.remove('edit-mode-active'); document.getElementById('editBar').style.display='none'; renderAll(); }
    
    function showSection(id) { 
      document.querySelectorAll('.section-page').forEach(s => s.classList.toggle('active', s.id === id)); 
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+id)); 
      document.body.style.overflowY = 'auto'; /* Allow natural scrolling always to prevent screen height freeze bugs */
      // Prevent Safari/Chrome layout thrashing by wrapping scroll in requestAnimationFrame
      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
      });
    }

    function openModal() { 
      document.getElementById('adminModal').style.display = 'flex'; 
      document.getElementById('adminPass').focus();
    }
    function closeModal() { document.getElementById('adminModal').style.display = 'none'; }
    function checkAdminPass() {
      if(document.getElementById('adminPass').value === "1234") { 
        editMode = true; 
        document.body.classList.add('edit-mode-active');
        document.getElementById('editBar').style.display = 'flex'; 
        closeModal(); 
        renderAll();
      } else { alert("Incorrect Password!"); }
    }
    document.getElementById('adminPass').onkeypress = (e) => { if(e.key==='Enter') checkAdminPass(); };
    
    // Admin access is exclusively triggered by clicking the 'CSS' skill tag.

    function updateText(path, val) {
      const parts = path.split('.');
      let target = data;
      for(let i=0; i<parts.length-1; i++) {
        if(!target[parts[i]]) target[parts[i]] = {};
        target = target[parts[i]];
      }
      target[parts[parts.length-1]] = val;
    }
    function changeImg(path) {
      const url = prompt("Enter new image URL:");
      if(url) { updateText(path, url); renderAll(); }
    }

    function renderAll() {
      const p = data.personal || {};
      const edit = editMode ? 'contenteditable="true"' : '';
      const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      
      const setH = (id, path) => {
        const el = document.getElementById(id);
        if(!el) return;
        const val = path.split('.').reduce((o,i)=> (o?o[i]:''), data);
        el.textContent = val || '';
        if(editMode) el.setAttribute('contenteditable','true');
        else el.removeAttribute('contenteditable');
        el.onblur = () => updateText(path, el.innerText);
      };

      setH('heroName', 'personal.name');
      setH('heroTitle', 'personal.title');
      setH('heroUni', 'personal.university');
      setH('heroBio', 'personal.bio');
      const emailEl = document.getElementById('heroEmailContainer');
      if (emailEl) {
        if (editMode) {
          emailEl.innerHTML = `
            <div style="margin-top:1.5rem; background:rgba(139, 92, 246, 0.1); padding:1rem; border-radius:15px; border:1px dashed var(--primary); text-align:left;">
              <label style="font-size:0.8rem; display:block; margin-bottom:0.5rem; opacity:0.7; color:#fff;">Edit Email Address:</label>
              <input type="text" id="emailInput" value="${p.email || ''}" 
                style="background:rgba(0,0,0,0.3); border:1px solid var(--primary); color:#fff; padding:0.6rem; border-radius:8px; width:100%; box-sizing:border-box; margin-bottom:0.5rem;" 
                onchange="data.personal.email=this.value"
              >
              <a href="mailto:${p.email || ''}" class="hero-link email-cta" style="margin-top:0.5rem; font-size:0.9rem; padding:0.6rem 1.5rem;">Contact Me (Preview)</a>
            </div>`;
        } else {
          emailEl.innerHTML = `<a href="mailto:${p.email || ''}" class="hero-link email-cta">Contact Me</a>`;
        }
      }
      
      const avatarCont = document.getElementById('heroAvatarContainer');
      if (avatarCont) {
        if (editMode) {
          avatarCont.innerHTML = `
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; gap:1rem;">
              ${p.avatar ? `<img class="hero-avatar" src="${p.avatar}">` : `<div class="hero-avatar" style="background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:900; border-radius:50%;">${(p.name||'U')[0]}</div>`}
              <div style="background:rgba(139, 92, 246, 0.1); padding:0.8rem; border-radius:12px; border:1px dashed var(--primary); width:220px; text-align:left;">
                <label style="font-size:0.7rem; display:block; margin-bottom:0.3rem; opacity:0.7; color:#fff;">Avatar URL:</label>
                <input type="text" value="${p.avatar || ''}" 
                  style="background:rgba(0,0,0,0.3); border:1px solid var(--primary); color:#fff; padding:0.4rem; border-radius:6px; width:100%; font-size:0.8rem; box-sizing:border-box;" 
                  onchange="data.personal.avatar=this.value; renderAll();"
                >
              </div>
            </div>`;
        } else {
          avatarCont.innerHTML = p.avatar ? `<img class="hero-avatar" src="${p.avatar}">` : `<div class="hero-avatar" style="background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:900; border-radius:50%;">${(p.name||'U')[0]}</div>`;
        }
      }
      
      document.getElementById('heroSkills').innerHTML = (p.skills||[]).map((s,i) => {
        const isCSS = s.trim().toUpperCase() === 'CSS';
        const adminClick = (!editMode && isCSS) ? 'onclick="openModal()"' : '';
        const adminStyle = (!editMode && isCSS) ? 'style="cursor: pointer;" title="Admin Access"' : '';
        return `<span class="skill-tag" ${adminClick} ${adminStyle} ${edit} onblur="data.personal.skills[${i}]=this.innerText">${esc(s)}</span>`;
      }).join('') + (editMode?`<button class="skill-tag" onclick="data.personal.skills.push('New Skill');renderAll()">+</button>`:'');
      
      const tabList = [['production','🏢 Production'],['competition','🏅 Competition'],['academic','🎓 Academic'],['personal','💡 Personal'],['opensource','🔓 Open Source']];
      document.getElementById('expTabs').innerHTML = tabList.map(([k,l])=>`
        <button onclick="currentTab='${k}';renderAll()" class="exp-tab-btn ${currentTab===k?'active':''}">
          ${l}
        </button>`).join('');
      
      const projects = (data.experience && data.experience[currentTab]) || [];
      const imgClass = currentTab === 'academic' ? 'project-img-academic' : 'project-img-document';
      document.getElementById('projectsGrid').innerHTML = projects.map((proj,i) => `
        <div class="project-card">
          ${editMode?`<button class="del-btn" onclick="data.experience['${currentTab}'].splice(${i},1);renderAll()">×</button>`:''}
          ${proj.img ? `<img class="${imgClass}" src="${proj.img}" ${editMode?`onclick="changeImg('experience.${currentTab}.${i}.img')"`:''}>` : (editMode ? `<div class="${imgClass}" onclick="changeImg('experience.${currentTab}.${i}.img')" style="display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(255,255,255,0.05); border:2px dashed rgba(255,255,255,0.2); font-weight:800; font-size:1.1rem; color:#fff;">➕ Add Image</div>` : '')}
          <div class="project-content">
            <h3 ${edit} onblur="data.experience['${currentTab}'][${i}].name=this.innerText">${esc(proj.name)}</h3>
            <div ${edit} onblur="data.experience['${currentTab}'][${i}].year=this.innerText" style="opacity:0.6; margin:0.5rem 0;">${esc(proj.year)}</div>
            <div ${edit} onblur="data.experience['${currentTab}'][${i}].role=this.innerText" style="color:var(--cyan); font-weight:800; font-size:1rem; margin-bottom:1.2rem;">${esc(proj.role)}</div>
            <p ${edit} onblur="data.experience['${currentTab}'][${i}].description=this.innerText">${esc(proj.description)}</p>
          </div>
        </div>`).join('') + (editMode?`<button class="add-btn" onclick="data.experience['${currentTab}'].push({name:'New Project',year:'2024',role:'Role',description:'Desc',img:''});renderAll()">+ Add Project</button>`:'');

      const renderRow = (list, path) => (list||[]).map((item,i) => `
        <div class="item-row-card">
          ${editMode?`<button class="del-btn" onclick="data.${path}.splice(${i},1);renderAll()">×</button>`:''}
          <strong ${edit} onblur="data.${path}[${i}].name=this.innerText">${esc(item.name)}</strong> • 
          <span ${edit} onblur="data.${path}[${i}].year=this.innerText">${esc(item.year)}</span>
        </div>`).join('') + (editMode?`<button class="add-btn" onclick="data.${path}.push({name:'New Item',year:'2024'});renderAll()">+ Add Item</button>`:'');

      if(data.selfDev) {
        document.getElementById('certsGrid').innerHTML = renderRow(data.selfDev.certs, 'selfDev.certs');
        document.getElementById('workshopsGrid').innerHTML = renderRow(data.selfDev.workshops, 'selfDev.workshops');
      }
      document.getElementById('competitionsGrid').innerHTML = renderRow(data.awards, 'awards');
      document.getElementById('leadershipGrid').innerHTML = renderRow(data.leadership, 'leadership');
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); initBackground(); }
    window.onload = loadData;
  </script>
</body>
</html>
